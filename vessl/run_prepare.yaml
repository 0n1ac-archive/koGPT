# ---------------------------------------------------------------------------
# STEP 1 — Tokenizer + data prep (CPU-bound; gpu-1 is enough).
# Streams FineWeb-2 KO + Wikisource, trains the tokenizer, writes train/val .bin
# to LOCAL /output, then uploads them to the kogpt-data storage volume with
# `vessl storage copy-file` (run containers are auto-authed as service-account).
#
# NOTE: storage volumes (volume://) CANNOT be mounted in a Run — import/mount
# both fail or don't persist. copy-file from inside the container is the way.
#
#   vessl run create -f vessl/run_prepare.yaml
# ---------------------------------------------------------------------------
name: kogpt-prepare
description: Train KO tokenizer + tokenize into train/val .bin, upload to volume

resources:
  cluster: yonsei-ai-gpu
  preset: gpu-1

image: quay.io/vessl-ai/torch:2.3.1-cuda12.1-r5

import:
  /root/koGPT:
    git:
      url: https://github.com/0n1ac-archive/koGPT
      ref: main

env:
  KOGPT_LANG: ko
  KOGPT_BIN_DIR: /output/bin       # local (ephemeral) during the run
  KOGPT_TOK: /output/tok/kogpt_sp
  HF_DATASETS_CACHE: /output/hf_cache
  HF_HUB_DISABLE_XET: "1"
  KOGPT_DATA_VOLUME: volume://vessl-storage/kogpt-data
  HF_TOKEN:
    value: KOHFGPTOKEN             # org Secret name (not the token itself)
    secret: true

run:
  - workdir: /root/koGPT
    command: |
      set -e
      pip install -r requirements.txt
      pip install -q -U vessl        # ensure the `storage` subcommand exists
      python tokenizer/train_tokenizer.py
      # persist the tokenizer immediately (cheap insurance before the long build)
      vessl storage copy-file /output/tok/kogpt_sp.model $KOGPT_DATA_VOLUME/tok/kogpt_sp.model
      vessl storage copy-file /output/tok/kogpt_sp.vocab $KOGPT_DATA_VOLUME/tok/kogpt_sp.vocab
      python data/prepare.py
      # persist the tokenized data to the volume
      vessl storage copy-file /output/bin/val_ko.bin   $KOGPT_DATA_VOLUME/bin/val_ko.bin
      vessl storage copy-file /output/bin/train_ko.bin $KOGPT_DATA_VOLUME/bin/train_ko.bin
      echo KOGPT_PREPARE_PERSISTED
